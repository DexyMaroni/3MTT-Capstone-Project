{% comment %}
Renders every field of `form` with labels, help text and errors.
Included by all the write-forms so styling stays in one place.

Three shapes, because one <label> + <input> does not fit every widget:

  radio     -> <fieldset>/<legend>. A group of inputs has no single id for a
               label to point at, so a plain <label> would render for="" and
               point nowhere.
  checkbox  -> label wraps the box so the text is part of the click target.
  everything else -> the usual label above the control.

Note: this must be {% templatetag openblock %} comment {% templatetag closeblock %},
not {# ... #}. Django's {# #} tag is single-line only and renders literally if
it spans a newline.
{% endcomment %}
{% if form.non_field_errors %}
  <ul class="form-errors">
    {% for error in form.non_field_errors %}<li>{{ error }}</li>{% endfor %}
  </ul>
{% endif %}

{% for field in form %}
  {% if field.field.widget.input_type == 'radio' %}

    <fieldset class="field field-choice{% if field.errors %} field-invalid{% endif %}">
      <legend>{{ field.label }}</legend>
      {{ field }}
      {% if field.help_text %}<div class="field-help">{{ field.help_text }}</div>{% endif %}
      {% for error in field.errors %}<p class="field-error">{{ error }}</p>{% endfor %}
    </fieldset>

  {% elif field.field.widget.input_type == 'checkbox' %}

    <div class="field field-check{% if field.errors %} field-invalid{% endif %}">
      <label for="{{ field.id_for_label }}">{{ field }}<span>{{ field.label }}</span></label>
      {% if field.help_text %}<div class="field-help">{{ field.help_text }}</div>{% endif %}
      {% for error in field.errors %}<p class="field-error">{{ error }}</p>{% endfor %}
    </div>

  {% else %}

    <div class="field{% if field.errors %} field-invalid{% endif %}">
      <label for="{{ field.id_for_label }}">{{ field.label }}</label>
      {{ field }}
      {% if field.help_text %}<div class="field-help">{{ field.help_text }}</div>{% endif %}
      {% for error in field.errors %}<p class="field-error">{{ error }}</p>{% endfor %}
    </div>

  {% endif %}
{% endfor %}
